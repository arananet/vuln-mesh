target:
  source: ./target           # local path to scan
  language: auto             # auto-detected; c/cpp for v0.1

ranker:
  top_n: 200                 # null = rank all files
  min_score: 0.05            # low threshold — unsafe-density patterns vary by language
  weights:
    surface: 0.5
    influence: 0.2
    reachability: 0.3

agents:
  concurrency: 32
  model_profile: triage      # adapter profile for hunt agents
  verifier_profile: verifier # adapter profile for adversarial verifier

oracle:
  asan: true
  ubsan: false               # v0.2
  adversarial_verify: true
  variant_hunt: false        # v0.2
  timeout: 10

report:
  formats: [markdown]        # sarif, json in v0.2
  patch_suggestions: false   # v0.2
  cvss_estimate: true

adapters:
  # ── Cloudflare Workers AI (recommended for Railway — no GPU needed) ──────
  triage:
    provider: cloudflare
    model: "@cf/meta/llama-3.1-8b-instruct"
    api_key: ""              # set CF_API_TOKEN env var

  verifier:
    provider: cloudflare
    model: "@cf/meta/llama-3.1-70b-instruct"
    api_key: ""              # set CF_API_TOKEN env var

  # ── Anthropic (higher quality, requires ANTHROPIC_API_KEY) ──────────────
  # triage:
  #   provider: anthropic
  #   model: claude-haiku-4-5-20251001
  #   api_key: ""

  # verifier:
  #   provider: anthropic
  #   model: claude-sonnet-4-6
  #   api_key: ""

  # ── Ollama (local, no cost) ──────────────────────────────────────────────
  # triage:
  #   provider: ollama
  #   model: qwen2.5-coder:32b
  #   base_url: http://localhost:11434

  exploit:
    provider: cloudflare
    model: "@cf/meta/llama-3.1-70b-instruct"
    api_key: ""
