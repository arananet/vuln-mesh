# railway.toml — Backend service
# ─────────────────────────────────────────────────────────────────────────────
# Create THREE services in the same Railway project:
#
#   1. backend   → this repo, Dockerfile.backend  (or Railpack via start.sh)
#   2. frontend  → this repo, Dockerfile.frontend
#   3. postgres  → Railway PostgreSQL plugin (auto-injects DATABASE_URL)
#
# In the Railway dashboard for each service:
#   Settings → Build → Dockerfile Path:
#     backend  → Dockerfile.backend
#     frontend → Dockerfile.frontend
#
# See README.md → Deployment for full variable reference.
# ─────────────────────────────────────────────────────────────────────────────

[build]
builder          = "DOCKERFILE"
dockerfilePath   = "Dockerfile.backend"

[deploy]
startCommand       = "bash start.sh"
healthcheckPath    = "/api/health"
healthcheckTimeout = 300
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 5
