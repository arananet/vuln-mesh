# railway.toml — Backend service
# ─────────────────────────────────────────────────────────────────────────────
# Railway deployment — create THREE services in the same project:
#
#   1. backend   → this repo, Dockerfile.backend  (or Railpack auto-detect)
#   2. frontend  → this repo, Dockerfile.frontend
#   3. postgres  → Railway PostgreSQL plugin (auto-injects DATABASE_URL)
#
# For each service in the Railway dashboard:
#   Settings → Source → Branch: set to the branch you want to deploy
#   Settings → Build  → Dockerfile Path: Dockerfile.backend or Dockerfile.frontend
#
# If you prefer Railpack over Docker for the backend, leave the build section
# blank — Railway will find start.sh automatically.
# ─────────────────────────────────────────────────────────────────────────────

[build]
builder          = "DOCKERFILE"
dockerfilePath   = "Dockerfile.backend"

[deploy]
startCommand       = "bash start.sh"
healthcheckPath    = "/api/health"
healthcheckTimeout = 300
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 5
