<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vuln-mesh — Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────── -->
<header>
  <div class="logo">
    <span class="logo-icon">◈</span>
    <span class="logo-name">vuln-mesh</span>
    <span class="logo-ver">v0.1</span>
  </div>

  <div class="header-sep"></div>

  <span id="status-badge" class="status-badge idle">
    <div class="status-dot"></div>IDLE
  </span>
  <span id="elapsed">00:00:00</span>
  <span id="target-path">—</span>
</header>

<!-- ── STATS ROW ───────────────────────────────────────── -->
<div class="stats-row">
  <div class="stat-card">
    <div class="stat-label">Files Ingested</div>
    <div class="stat-value" id="stat-ingested">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Ranked</div>
    <div class="stat-value" id="stat-ranked">0</div>
  </div>
  <div class="stat-card active">
    <div class="stat-label">Active Agents</div>
    <div class="stat-value" id="stat-active">0</div>
  </div>
  <div class="stat-card found">
    <div class="stat-label">Raw Findings</div>
    <div class="stat-value" id="stat-raw">0</div>
  </div>
  <div class="stat-card confirmed">
    <div class="stat-label">Confirmed</div>
    <div class="stat-value" id="stat-confirmed">0</div>
  </div>
</div>

<!-- ── PIPELINE BAR ────────────────────────────────────── -->
<div class="pipeline-bar">
  <div class="stage" id="stage-ingestion">
    <div class="stage-dot"></div>Ingestion
  </div>
  <div class="stage-arrow">→</div>
  <div class="stage" id="stage-ranker">
    <div class="stage-dot"></div>Ranker
  </div>
  <div class="stage-arrow">→</div>
  <div class="stage" id="stage-agents">
    <div class="stage-dot"></div>Agent Mesh
  </div>
  <div class="stage-arrow">→</div>
  <div class="stage" id="stage-oracle">
    <div class="stage-dot"></div>Oracle
  </div>
  <div class="stage-arrow">→</div>
  <div class="stage" id="stage-report">
    <div class="stage-dot"></div>Report
  </div>
</div>

<!-- ── MAIN GRID ────────────────────────────────────────── -->
<div class="main-grid">

  <!-- File Queue -->
  <div class="panel">
    <div class="panel-header">
      <span>File Queue</span>
      <span class="panel-count" id="file-count">0 files</span>
    </div>
    <div class="panel-body" id="file-list"></div>
  </div>

  <!-- Findings -->
  <div class="panel">
    <div class="panel-header">
      <span>Confirmed Findings</span>
      <span class="panel-count" id="find-count">0 confirmed</span>
    </div>
    <div class="panel-body" id="findings-list"></div>
  </div>

</div>

<!-- ── LOG PANEL ────────────────────────────────────────── -->
<div class="log-panel">
  <div class="panel-header">
    <span>Event Log</span>
  </div>
  <div class="log-body" id="log-body"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
