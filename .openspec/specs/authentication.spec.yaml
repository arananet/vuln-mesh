title: "Dashboard Authentication — Login Screen and API Key Middleware"
slug: "authentication"
type: feature
status: review

author: "arananet"
created_at: "2026-04-18"
updated_at: "2026-04-18"

description: |
  Protects the vuln-mesh dashboard so only authorized users can access live
  scan events and historical findings. The backend enforces an API key on all
  /events and /api/* routes; /api/health and static files remain public.
  The frontend shows a login screen when the backend requires authentication,
  validates the entered key against the backend, and stores the accepted key
  in sessionStorage (cleared on tab close). The API key is never injected
  into any publicly-served file — users prove possession by entering it.

acceptance_criteria:
  - "Given ADMIN_PASS is set, when a request hits /api/scans without credentials, then the backend returns 401"
  - "Given ADMIN_PASS is set, when Authorization: Bearer <token> is correct, then the request succeeds"
  - "Given ADMIN_PASS is set, when ?token=<token> is correct on /events, then the request succeeds (EventSource cannot send headers)"
  - "Given ADMIN_PASS is empty, when any request arrives, then all routes are accessible with no credentials"
  - "Given /api/health and /api/login, regardless of ADMIN_PASS, then they always return 200/accessible (Railway health probe + login flow)"
  - "Given the frontend loads and the backend returns 401 on probe, then a login screen with username and password fields is shown"
  - "Given the user submits correct credentials via POST /api/login, then a session token is returned and stored in sessionStorage"
  - "Given the user submits wrong credentials, then the backend returns 401 and an error message is shown"
  - "Given a valid token is in sessionStorage on page load, then the login screen is skipped"
  - "Given the session token, it is derived server-side from credentials and never stored or injected into any public file"

test_plan:
  - "Unit test: /api/health returns 200 when ADMIN_PASS is set"
  - "Unit test: / (index) returns 200 when ADMIN_PASS is set"
  - "Unit test: /api/login is accessible without credentials and returns token on correct user/pass"
  - "Unit test: /api/login returns 401 on wrong credentials"
  - "Unit test: /api/scans returns 401 when ADMIN_PASS is set and no token supplied"
  - "Unit test: /api/scans returns 200 when correct Bearer token is supplied"
  - "Unit test: /api/scans returns 401 when an incorrect token is supplied"
  - "Unit test: /api/scans returns 200 when ADMIN_PASS is empty (open mode)"

out_of_scope:
  - "Multi-user accounts or per-user roles"
  - "OAuth / SSO integration"
  - "Rate limiting on login attempts"
  - "HTTPS enforcement (handled by Railway / reverse proxy)"
  - "Refresh tokens or JWT — sessionStorage key is sufficient for a single-operator tool"

implementation_skill: null

technical_notes: |
  Token = sha256(f"{ADMIN_USER}:{ADMIN_PASS}") — stateless, no DB, no secrets table.
  Middleware reads ADMIN_PASS at request time so it can be set without restarting.
  EventSource cannot send custom headers; /events accepts ?token= query param.
  sessionStorage clears on tab close — appropriate for a security-sensitive tool.
  ADMIN_PASS="" disables auth entirely (local dev mode).

regression_test: "tests/test_dashboard_app.py — test_api_scans_blocked_without_token, test_api_scans_allowed_with_correct_token, test_wrong_token_returns_401, test_empty_admin_pass_means_open_access, test_login_endpoint_is_public, test_login_wrong_credentials_returns_401"

