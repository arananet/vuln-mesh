[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vuln-mesh"
version = "0.1.0"
description = "Model-agnostic vulnerability discovery pipeline using layered LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.28",
    "click>=8.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "aiosqlite>=0.20",
]

[project.scripts]
vuln-mesh = "vuln_mesh.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["vuln_mesh"]
